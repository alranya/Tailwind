<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signup psge</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-purple-100  flex items-center justify-center">
    <div class="bg-white w-96 p-10 shadow-md rounded-lg" >
        <h3 class="font-bold text-center text-3xl text-purple-700 mb-6">Sign Up</h3>
<form >
    <div class="mb-4" >
        <label class="font-bold  " >Name:</label>
        <input type="text" class=" rounded  w-full border border-slate-200 outline-none px-4 py-2 focus:border-purple-500" >
    </div>
    <div class="mb-4" >
        <label class="font-bold  " >Email:</label>
        <input type="email" class=" rounded  w-full border border-slate-200 outline-none px-4 py-2 focus:border-purple-500" >
    </div>
    <div class="mb-4" >
        <label class="font-bold " >Password:</label>
        <input type="password" class=" rounded w-full border border-slate-200 outline-none px-4 py-2 focus:border-purple-500" >
    </div>
    <div class="mb-4 ">
        <label class="font-bold  " >Users</label>
        <select name="" id="" class="bg-slate-200 w-full outline-none px-4 py-2 hover:border-black">
            <option value="">Admin1</option>
             <option value="">Admin2</option>
              <option value="">Admin3</option>
        </select>
    </div>

    <div class="mb-4">
         <button class="border bg-purple-500 text-white rounded px-6 py-1  hover:bg-purple-600"> Sign up</button> 
        </div>
</form>

<div class="text-sm text-center font-semibold">
    <span>Already have an account?</span>
    <a href="./login.html" class="text-purple-600 hover:underline">Login</a> 
    
</div>
   


    </div>
    
</body>
</html>
