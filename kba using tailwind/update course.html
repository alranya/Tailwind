<body class=" ">
    <div class="bg-purple-100 flex justify-between shadow-sm">
        <div>
            <img src="./kba logo.jpeg" alt="logo" class=" size-14 relative ">
        </div>
<div class="flex gap-3 items-center p-2 font-semibold text-sm">
    <a href="./home.html" class="hover:text-purple-600">Home</a>

    <div class="bg-purple-100  p-8 w-150  m-auto my-6 rounded-lg">
          <h3 class="font-bold text-center text-3xl text-purple-700 mb-6 ">Update Course</h3>

        <form >
    <div class="mb-4" >
        <label class="font-bold  " >Course Name</label>
        <input type="text" required placeholder="eg.Certified blockchain associate" class=" rounded  w-full bg-white border border-slate-200 outline-none px-4 py-2 focus:border-purple-500" >
    </div>

     <div class="mb-4 ">
        <label class="font-bold  " >Course Type</label>
        <select name="" id="" class="bg-white w-full outline-none px-4 py-2 hover:border-black">
            <option value="">Self-paced</option>
             <option value="">Hybrid</option>
              <option value="">Online</option>
        </select>
    </div>
<div class="mb-4" >
        <label class="font-bold  " >Description</label>
        <textarea name="" id="" placeholder="Small Description on the course" class=" rounded  w-full bg-white border border-slate-200 outline-none px-4 py-2 focus:border-purple-500"></textarea> 
    </div>

<div class="mb-4 ">
        <label class="font-bold  " >Price</label>
        <select name="" id="" class="bg-white w-full outline-none px-4 py-2 hover:border-black">
            <option value="">Rs.500</option>
             <option value="">Rs.1000</option>
              <option value="">Rs.5000</option>
        </select>
    </div>
    <div class=" mt-8">
        <form action="./update course.html">
         <button class="border bg-purple-500 text-white rounded-full px-6 py-1  hover:bg-purple-600 w-full " > Update Courses</button> </form>
        </div>
</form>
