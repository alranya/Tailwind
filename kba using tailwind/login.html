<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-purple-100 h-screen flex items-center justify-center">
    <div class="bg-white p-10 rounded-lg shadow-md w-96">
<h2 class="text-3xl font-bold text-center text-purple-700 mb-6">Login</h2>

 <form>
    
 <div class="mb-4">
      <label class=" text-slate-800 font-bold mb-2 text-sm">Email:</label>
     <input type="email"  required class="w-full border border-slate-200 rounded px-3 py-2 outline-none focus:border-purple-500">
   </div>
   <div class="mb-6">
     <label class=" text-slate-800 font-bold mb-2 text-sm">Password:</label>
     <input type="password" required class="w-full border border-slate-200 rounded px-3 py-2 outline-none focus:border-purple-500">
     </div>
 <div class="flex items-center justify-between mb-8">
     <button type="button" class="bg-purple-500 text-white px-6 py-2 rounded hover:bg-purple-600">Login</button>
      <a href="#" class="text-purple-600 text-sm hover:underline">Forgot Password?</a>
     </div>
     </form>
    <div class="text-center text-sm">
     <span class="text-slate-800">Don't have an account? </span>
     <a href="./signup.html" class="text-purple-600 hover:underline">Sign Up</a>
     </div>

    </div>

    
</body>
</html>
